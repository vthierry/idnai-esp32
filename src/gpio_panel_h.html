<html>
  <head>
    <title>GPIO board control panel</title>
    <script type='text/javascript' src='https://vthierry.github.io/idnai-web/webcontrols.js'></script>
    <script type='text/javascript' src='https://vthierry.github.io/idnai-web/fetchService.js'></script>
    <link rel='stylesheet' href='https://vthierry.github.io/idnai-web/webcontrols.css'/> 
  </head>
  <body style='width:820px'>
    <h1>GPIO board control panel</h1>
    <div class='button-bar'>
      <b>Pin index:</b>
      <input id='index' type='text' value='13' size='3'/>
    </div>
    <div class='button-bar'>
      <b>Digital I/O:</b>
      <button onclick='doFetch("@/gpio", "value=1")' style='background-color:red'>ON</button>
      <button onclick='doFetch("@/gpio", "value=0")' style='background-color:lightgreen'>OFF</button>
      <button onclick='doFetch("@/gpio", "")' class='button' style='background-color:magenta'>Get</button> 
      <button onclick='doFetch("@/gpio", "mode=up")' class='button' style='background-color:magenta'>Get up</button> 
      <button onclick='doFetch("@/gpio", "mode=down")' class='button' style='background-color:magenta'>Get down</button> 
   </div>
    <div class='button-bar'>
      <b>Timing measure:</b>
      <script>webcontrols.addButtonOnOff("timing", { on_text: "Start", off_text: "Stop"}, function(value) {
        doFetch("@/gpio", "action=" + (value ? "start" : "stop"));
      });</script>
      <button onclick='doFetch("@/gpio", "action=get")' style='background-color:magenta'>Get</button>
    </div>
    <div class='button-bar'>
      <b>Analog I/O:</b>
      <script>webcontrols.addButtonRange("Analog value", {});</script>
      <button onclick='doFetch("@/gpio", "mode=analog&value="+analog_value)' style='background-color:yellow'>Put</button>
      <button onclick='doFetch("@/gpio", "mode=analog")' style='background-color:magenta'>Get</button>
    </div>
    <script>
      webcontrols.addConsole(true);
      function doFetch(url, input) {
        let index = document.getElementById("index").value;
        fetchService(url, input+"&index="+index)l
      }
    </script>
    <div class='button-bar'>
      <button title='Pings the web service to verify if alive' onclick='webcontrols.curl("@/hi", "")' style='background-color:yellow'>Ping</button>
       <button title='Returns the loop() delay time' onclick='webcontrols.curl("@/loop", "")' style='background-color:blue'>Loop</button>
     <button title='Restarts the ESP32 microcontroler' onclick='webcontrols.curl("@/restart", "")' style='background-color:magenta'>Restart</button>
     <button title='Halts the ESP32 microcontroler (deep sleeping mode)' onclick='webcontrols.curl("@/sleep", "")' style='background-color:red'>Halt</button>
    </div>
  </body>
</html>
